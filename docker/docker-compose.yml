
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq_antifraude_elastico
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin123"

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M